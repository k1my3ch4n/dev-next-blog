name: storybook_pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/storybook_pages.yml"
      - "apps/storybook/**"
      - "packages/components/**"
      - "packages/content/**"
      - "packages/hooks/**"
      - "packages/tailwind-config/**"
      - "packages/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook dependencies
        run: pnpm --filter=@repo/hooks build

      - name: Check Storybook types
        run: pnpm --filter=storybook check-types

      - name: Build Storybook
        run: pnpm --filter=storybook build-storybook

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/storybook/storybook-static

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
