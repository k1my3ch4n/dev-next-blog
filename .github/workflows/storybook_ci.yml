name: storybook_ci

on:
  pull_request:
    paths:
      - ".github/workflows/storybook_ci.yml"
      - "apps/storybook/**"
      - "packages/components/**"
      - "packages/content/**"
      - "packages/hooks/**"
      - "packages/tailwind-config/**"
      - "packages/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Storybook types
        run: pnpm check-types:storybook

      - name: Build Storybook
        run: pnpm build:storybook
